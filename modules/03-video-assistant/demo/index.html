<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Видеоконсультант — демо</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070a12;
        color: #f7f8ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 10%, rgba(94, 92, 230, .35), transparent 34rem),
          radial-gradient(circle at 90% 80%, rgba(19, 211, 170, .18), transparent 30rem),
          #070a12;
      }
      main {
        width: min(900px, calc(100% - 32px));
        padding: clamp(28px, 6vw, 72px);
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 32px;
        background: rgba(14, 18, 31, .78);
        box-shadow: 0 28px 90px rgba(0,0,0,.45);
        backdrop-filter: blur(24px);
      }
      .eyebrow { color: #9a9cff; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 16px 0; max-width: 720px; font-size: clamp(40px, 7vw, 76px); line-height: .98; letter-spacing: -.055em; }
      p { max-width: 650px; color: #b8bfd3; font-size: clamp(17px, 2vw, 21px); line-height: 1.55; }
      .steps { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
      .steps span { padding: 9px 13px; border-radius: 999px; background: rgba(255,255,255,.07); color: #dfe3f2; }
      #status { margin-top: 22px; color: #ffbd73; font-size: 14px; }
    </style>
    <script src="./runtime-config.js"></script>
    <script src="https://unpkg.com/@tavus/widget"></script>
  </head>
  <body>
    <main>
      <div class="eyebrow">демо</div>
      <h1>Видеоагент, который понимает цель разговора</h1>
      <p>
        Нажмите на кнопку в правом нижнем углу. Влад уточнит ваш бизнес и покажет,
        как универсальный консультант может быть адаптирован под сайт.
      </p>
      <div class="steps">
        <span>Русский язык</span>
        <span>Objectives</span>
        <span>Guardrails</span>
        <span>Magic Canvas</span>
      </div>
      <div id="status"></div>
    </main>
    <script>
      const runtime = window.TAVUS_RUNTIME;
      const status = document.querySelector("#status");
      if (!runtime?.deploymentId) {
        status.textContent = "Сначала выполните npm run tavus:setup — он создаст локальный runtime-config.js.";
      } else {
        const widget = document.createElement("tavus-widget");
        widget.setAttribute("deployment-id", runtime.deploymentId);
        widget.setAttribute("custom-greeting", runtime.greeting);
        widget.setAttribute("conversational-context", runtime.context);
        if (runtime.memoryEnabled) {
          widget.setAttribute("memory-stores", `${runtime.memoryNamespace}:anonymous-demo`);
        }
        document.body.append(widget);
      }
    </script>
  </body>
</html>
