# Во всех модулях тест называется test_ready.py. Без import-mode пакет,
# запущенный из корня репозитория, спотыкается о совпадающие имена.
# Внутри одного модуля всё работало и без неё.
#
# asyncio_mode нужен продавцу: его движок асинхронный, и тесты тоже.
[pytest]
addopts = --import-mode=importlib
asyncio_mode = auto
